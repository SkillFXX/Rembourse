name: Deploy Rembourse to Proxmox CTX

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy-runner:
    name: Déploiement sur CTX Proxmox (Self-Hosted Runner)
    runs-on: self-hosted
    steps:
      - name: 📥 Mise à jour du code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🔨 Compilation PWA & Node
        run: npm run build

      - name: 🚀 Installation et déploiement dans /opt/rembourse
        run: |
          NODE_BIN=$(which node || echo "/usr/bin/node")
          echo "Node binary: $NODE_BIN"

          # 1. Préparer le dossier de production
          mkdir -p /opt/rembourse/data

          # 2. Copier les fichiers compilés et les dépendances
          cp -r build package*.json /opt/rembourse/
          cp -r node_modules /opt/rembourse/

          # 3. Créer ou mettre à jour le service systemd automatiquement
          cat << EOF > /etc/systemd/system/rembourse.service
          [Unit]
          Description=Rembourse PWA Service
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/rembourse
          ExecStart=$NODE_BIN build/index.js
          Restart=always
          RestartSec=5
          Environment=NODE_ENV=production
          Environment=PORT=3000
          Environment=HOST=0.0.0.0

          [Install]
          WantedBy=multi-user.target
          EOF

          # 4. Recharger systemd et démarrer / redémarrer le service
          systemctl daemon-reload
          systemctl enable rembourse
          systemctl restart rembourse

          # 5. Vérifier que le service tourne
          sleep 2
          systemctl status rembourse --no-pager
          echo "🎉 Rembourse est en ligne et à jour sur http://localhost:3000 !"
